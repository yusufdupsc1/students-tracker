name: CI/CD Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

# Vercel auto-deploys on push to main via GitHub integration — no secrets needed
# This pipeline just verifies quality; Vercel handles deploy separately

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  quality:
    name: Quality Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  e2e:
    name: E2E Smoke Tests
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
        env:
          CI: true

  lighthouse:
    name: Lighthouse CI
    runs-on: ubuntu-latest
    needs: [quality, e2e]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Start preview server
        run: |
          nohup npm run preview -- --port 4173 --host 0.0.0.0 > /tmp/preview.log 2>&1 &
          echo $! > /tmp/preview.pid
          cat /tmp/preview.log
      - name: Wait for server
        run: npx --yes wait-on http://localhost:4173 --timeout 60000 --verbose
      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        continue-on-error: true
        with:
          uploadArtifacts: true
          temporaryPublicStorage: true
          urls: |
            http://localhost:4173/
            http://localhost:4173/login
            http://localhost:4173/signup
        env:
          LHCI_BUILD_CONTEXT__CURRENT_HASH: ${{ github.sha }}
      - name: Cleanup preview
        if: always()
        run: |
          kill $(cat /tmp/preview.pid) || true
          cat /tmp/preview.log || true
