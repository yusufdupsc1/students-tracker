name: CI/CD Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

# Cancel previous runs if new push arrives
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  quality:
    name: Quality Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://hzgaflrabmrcsokhoatv.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'placeholder-key' }}
          VITE_ADMIN_TOKEN: ${{ secrets.VITE_ADMIN_TOKEN || '' }}

  e2e:
    name: E2E Smoke Tests
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://hzgaflrabmrcsokhoatv.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'placeholder-key' }}
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
        env:
          CI: true

  lighthouse:
    name: Lighthouse CI
    runs-on: ubuntu-latest
    needs: [quality, e2e]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://hzgaflrabmrcsokhoatv.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'placeholder-key' }}
      - name: Start preview server
        run: |
          nohup npm run preview -- --port 4173 --host 0.0.0.0 > /tmp/preview.log 2>&1 &
          echo $! > /tmp/preview.pid
          cat /tmp/preview.log
      - name: Wait for server
        run: npx --yes wait-on http://localhost:4173 --timeout 60000 --verbose
      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        continue-on-error: true
        with:
          uploadArtifacts: true
          temporaryPublicStorage: true
          urls: |
            http://localhost:4173/
            http://localhost:4173/login
            http://localhost:4173/signup
        env:
          LHCI_BUILD_CONTEXT__CURRENT_HASH: ${{ github.sha }}
      - name: Cleanup preview
        if: always()
        run: |
          kill $(cat /tmp/preview.pid) || true
          cat /tmp/preview.log || true

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 15
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: students-tracker:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-vercel:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    needs: [quality, e2e, lighthouse]
    timeout-minutes: 10
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # Only run if Vercel secrets are configured; otherwise skip gracefully
    steps:
      - uses: actions/checkout@v4
      - name: Check Vercel secrets
        id: check
        run: |
          if [ -z "${{ secrets.VERCEL_TOKEN }}" ] || [ -z "${{ secrets.VERCEL_ORG_ID }}" ] || [ -z "${{ secrets.VERCEL_PROJECT_ID }}" ]; then
            echo "missing=true" >> $GITHUB_OUTPUT
            echo "⚠️ Vercel secrets not configured — skipping deploy (build already verified)"
          else
            echo "missing=false" >> $GITHUB_OUTPUT
          fi
      - uses: actions/setup-node@v4
        if: steps.check.outputs.missing == 'false'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: steps.check.outputs.missing == 'false'
      - run: npm run build
        if: steps.check.outputs.missing == 'false'
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_ADMIN_TOKEN: ${{ secrets.VITE_ADMIN_TOKEN }}
      - name: Deploy to Vercel
        if: steps.check.outputs.missing == 'false'
        uses: amondnet/vercel-action@v20
        continue-on-error: true
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'
          working-directory: ./
          scope: ${{ secrets.VERCEL_ORG_ID }}
      - name: Skip notice
        if: steps.check.outputs.missing == 'true'
        run: echo "Vercel deploy skipped — add VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID secrets to enable auto-deploy"

  supabase-migrate:
    name: Supabase Migrations
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 10
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Check Supabase secrets
        id: check
        run: |
          if [ -z "${{ secrets.SUPABASE_PROJECT_ID }}" ] || [ -z "${{ secrets.SUPABASE_ACCESS_TOKEN }}" ]; then
            echo "missing=true" >> $GITHUB_OUTPUT
            echo "⚠️ Supabase secrets not configured — skipping migrations"
          else
            echo "missing=false" >> $GITHUB_OUTPUT
          fi
      - uses: supabase/setup-cli@v1
        if: steps.check.outputs.missing == 'false'
        with:
          version: latest
      - name: Link Supabase project
        if: steps.check.outputs.missing == 'false'
        run: supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_ID }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      - name: Run migrations
        if: steps.check.outputs.missing == 'false'
        run: supabase db push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      - name: Seed admin (non-blocking)
        if: steps.check.outputs.missing == 'false'
        continue-on-error: true
        run: npm run seed:admin || echo "seed:admin failed – check logs; ensure RLS policies allow insert"
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          ADMIN_SCHOOL_NAME: ${{ secrets.ADMIN_SCHOOL_NAME }}
