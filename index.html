<!doctype html>
<html lang="bn">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" href="/icons/icon-192.png" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#811B22" />
    <meta name="color-scheme" content="light dark" />
    <title>বেজখণ্ড সঃ প্রাঃ বিদ্যালয়</title>
    <link rel="preload" href="/src/assets/fonts/HindSiliguri-Regular.woff2" as="font" type="font/woff2" crossorigin>
    <!-- cache-bust: force CDN refresh 2026-07-16T00:58:00+06:00 -->
    <script>
      (function() {
        try {
          const saved = localStorage.getItem('theme');
          const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          const theme = saved || (prefersDark ? 'dark' : 'light');
          if (theme === 'dark') document.documentElement.classList.add('dark');
        } catch {}
      })();
    </script>
  </head>
  <body>
    <div id="root">লোড হচ্ছে...</div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
